<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCID₅₀ Calculator (Kärber Method)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { color: #2d6a4f; text-align: center; }
        .param-group, .table-group, .result-group {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        label { display: inline-block; width: 220px; margin: 5px 0; }
        input[type="number"] { width: 80px; padding: 5px; margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: center; }
        th { background: #e9ecef; }
        button {
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background-color: #1b4d3a; }
        .result-box {
            background: #f1f8f4;
            padding: 15px;
            border-left: 4px solid #2d6a4f;
            margin-top: 15px;
        }
        .log-value { font-weight: bold; font-size: 1.3em; }
        .titer-value { font-size: 2em; color: #c0392b; font-weight: bold; }
        .footer { text-align: center; margin-top: 20px; color: #888; font-style: italic; }
        @media print {
            body { background: white; box-shadow: none; }
            button { display: none; }
            .param-group, .table-group { border: none; }
        }
    </style>
</head>
<body>
    <h1>🧬 TCID₅₀ Calculator (Kärber Method)</h1>

    <div class="param-group">
        <h3>Parameters</h3>
        <label>Wells per dilution:</label>
        <input type="number" id="wells" value="4" min="1"><br>
        <label>Dilution factor:</label>
        <input type="number" id="dilFactor" value="10" min="1.1" step="any"><br>
        <label>Log₁₀ of first dilution (e.g., -1):</label>
        <input type="number" id="firstLog" value="-1" step="any"><br>
        <label>Number of dilutions:</label>
        <input type="number" id="numDil" value="4" min="1" onchange="updateTable()"><br>
        <label>Inoculum volume (mL):</label>
        <input type="number" id="inocVol" value="0.1" step="any">
    </div>

    <div class="table-group">
        <h3>Positive Wells per Dilution</h3>
        <table id="dilTable">
            <thead>
                <tr><th>Dilution</th><th>Positive Wells</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div style="text-align: center;">
        <button onclick="calculate()">Calculate</button>
        <button onclick="printReport()">Print / PDF Report</button>
        <button onclick="clearAll()">Clear</button>
    </div>

    <div id="results" class="result-group" style="display: none;">
        <h3>Results</h3>
        <div id="resultText"></div>
    </div>

    <div class="footer">Powered By Pourdad Panahi</div>

    <script>
        // Initialize table
        updateTable();

        function updateTable() {
            const numDil = parseInt(document.getElementById('numDil').value) || 0;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const firstLog = parseFloat(document.getElementById('firstLog').value) || 0;
            const dilFactor = parseFloat(document.getElementById('dilFactor').value) || 10;
            const logStep = Math.log10(dilFactor);

            for (let i = 0; i < numDil; i++) {
                const exponent = firstLog - i * logStep;
                let dilStr;
                if (exponent < 0) {
                    dilStr = `10<sup>${exponent.toFixed(3)}</sup>`;
                } else {
                    const denom = Math.pow(10, exponent);
                    dilStr = `1/${denom.toFixed(3)}`;
                }
                const row = tbody.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);
                cell1.innerHTML = dilStr;
                const input = document.createElement('input');
                input.type = 'number';
                input.min = 0;
                input.value = 0;
                input.style.width = '80px';
                cell2.appendChild(input);
            }
        }

        function calculate() {
            const wells = parseInt(document.getElementById('wells').value);
            const dilFactor = parseFloat(document.getElementById('dilFactor').value);
            const firstLog = parseFloat(document.getElementById('firstLog').value);
            const numDil = parseInt(document.getElementById('numDil').value);
            const inocVol = parseFloat(document.getElementById('inocVol').value);

            if (wells <= 0 || dilFactor <= 0 || numDil <= 0 || inocVol <= 0) {
                alert('All parameters must be positive numbers.');
                return;
            }

            // Collect positive counts
            const inputs = document.querySelectorAll('#tableBody input[type="number"]');
            const positives = [];
            for (let inp of inputs) {
                const val = parseInt(inp.value);
                if (isNaN(val) || val < 0 || val > wells) {
                    alert(`Positive count must be between 0 and ${wells}.`);
                    return;
                }
                positives.push(val);
            }

            if (positives.length !== numDil) {
                alert('Mismatch in number of dilutions.');
                return;
            }

            // Proportions and Kärber formula
            const proportions = positives.map(p => p / wells);
            const S = proportions.reduce((a, b) => a + b, 0);
            const logStep = Math.log10(dilFactor);
            const log10TCID50 = firstLog - logStep * (S - 0.5);
            const tcid50Dil = Math.pow(10, log10TCID50);
            const titer = Math.pow(10, -log10TCID50) / inocVol;

            // Build result HTML
            const now = new Date().toLocaleString();
            let html = `<p><strong>Calculation Date:</strong> ${now}</p>`;
            html += `<p><strong>Wells per dilution:</strong> ${wells}</p>`;
            html += `<p><strong>Dilution factor:</strong> ${dilFactor}</p>`;
            html += `<p><strong>Log₁₀ (first dil.):</strong> ${firstLog}</p>`;
            html += `<p><strong>Inoculum volume:</strong> ${inocVol} mL</p>`;
            html += `<h4>Positive wells per dilution:</h4><ul>`;
            for (let i = 0; i < positives.length; i++) {
                html += `<li>Dilution ${i+1}: ${positives[i]} / ${wells}</li>`;
            }
            html += `</ul>`;
            html += `<h4>Kärber Method Results:</h4>`;
            html += `<p>Sum of proportions (Σp) = ${S.toFixed(3)}</p>`;
            html += `<p class="log-value">log₁₀(TCID₅₀) = ${log10TCID50.toFixed(4)}</p>`;
            html += `<p>TCID₅₀ dilution factor = ${tcid50Dil.toFixed(6)} (≈ ${tcid50Dil.toPrecision(3)})</p>`;
            html += `<p class="titer-value">Virus titer = ${titer.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} TCID₅₀ / mL</p>`;

            document.getElementById('resultText').innerHTML = html;
            document.getElementById('results').style.display = 'block';

            // Store for printing
            window.lastResults = { wells, dilFactor, firstLog, numDil, inocVol, positives, S, log10TCID50, tcid50Dil, titer };
        }

        function clearAll() {
            document.getElementById('wells').value = 4;
            document.getElementById('dilFactor').value = 10;
            document.getElementById('firstLog').value = -1;
            document.getElementById('numDil').value = 4;
            document.getElementById('inocVol').value = 0.1;
            updateTable();
            document.getElementById('results').style.display = 'none';
        }

        function printReport() {
            if (!window.lastResults) {
                alert('Please calculate first.');
                return;
            }
            const p = window.lastResults;
            const now = new Date().toLocaleString();
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>TCID50 Report</title>
                    <style>
                        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; }
                        h1 { color: #2d6a4f; text-align: center; }
                        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
                        th, td { padding: 8px; border: 1px solid #ddd; text-align: center; }
                        th { background: #f0f0f0; }
                        .log-value { font-weight: bold; font-size: 1.2em; }
                        .titer-value { font-size: 1.8em; color: #c0392b; font-weight: bold; }
                        .footer { text-align: center; margin-top: 30px; color: #888; font-style: italic; }
                    </style>
                </head>
                <body>
                    <h1>🧬 TCID₅₀ Assay Report</h1>
                    <p>Calculation Date: ${now}</p>
                    <h3>Parameters</h3>
                    <table>
                        <tr><th>Parameter</th><th>Value</th></tr>
                        <tr><td>Wells per dilution</td><td>${p.wells}</td></tr>
                        <tr><td>Dilution factor</td><td>${p.dilFactor}</td></tr>
                        <tr><td>Log₁₀ of first dilution</td><td>${p.firstLog}</td></tr>
                        <tr><td>Number of dilutions</td><td>${p.numDil}</td></tr>
                        <tr><td>Inoculum volume (mL)</td><td>${p.inocVol}</td></tr>
                    </table>
                    <h3>Positive Wells per Dilution</h3>
                    <table>
                        <tr><th>Dilution</th><th>Positive / Total</th></tr>`);
            const logStep = Math.log10(p.dilFactor);
            for (let i = 0; i < p.positives.length; i++) {
                const exponent = p.firstLog - i * logStep;
                let dilStr = exponent < 0 ? `10<sup>${exponent.toFixed(3)}</sup>` : `1/${Math.pow(10, exponent).toFixed(3)}`;
                printWindow.document.write(`<tr><td>${dilStr}</td><td>${p.positives[i]} / ${p.wells}</td></tr>`);
            }
            printWindow.document.write(`
                    </table>
                    <h3>Kärber Method Results</h3>
                    <p><strong>Sum of proportions (Σp):</strong> ${p.S.toFixed(3)}</p>
                    <p class="log-value">log₁₀(TCID₅₀) = ${p.log10TCID50.toFixed(4)}</p>
                    <p><strong>TCID₅₀ dilution factor:</strong> ${p.tcid50Dil.toFixed(6)} (≈ ${p.tcid50Dil.toPrecision(3)})</p>
                    <p class="titer-value">Virus titer = ${p.titer.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} TCID₅₀ / mL</p>
                    <div class="footer">Powered By Pourdad Panahi</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
    </script>
</body>
</html>
